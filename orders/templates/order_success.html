<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #f4f6f9, #eaf0f6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .success-container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
        }

        h2 {
            font-size: 28px;
            color: #27ae60;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            color: #34495e;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(41,128,185,0.4);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h2>Your order is done ✅</h2>
        <p>Thank you for your order! We are preparing it and will contact you if needed.</p>
        <a href="{% url 'menu' %}" class="back-button">Back to Menu</a>
    </div>
</body>
</html>
