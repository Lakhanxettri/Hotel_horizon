<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        form {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #27ae60;
            outline: none;
            box-shadow: 0 0 8px rgba(39,174,96,0.2);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        h3 {
            margin-top: 25px;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-bottom: 15px;
        }

        ul li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }

        ul li:last-child {
            border-bottom: none;
        }

        p.total {
            text-align: right;
            font-weight: 700;
            font-size: 18px;
            margin-top: 10px;
        }

        .button-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button-bar a,
        .button-bar button {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            color: white;
        }

        .confirm-button {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
        }
        .confirm-button:hover {
            transform: translateY(-2px);
        }

        .cart-button {
            background: #e67e22;
        }

        .menu-button {
            background: #3498db;
        }

        @media (max-width: 650px) {
            .button-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<h2>Checkout</h2>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Phone:</label>
    <input type="text" name="phone" required>

    <label>Address:</label>
    <textarea name="address"></textarea>

    <h3>Order Summary:</h3>
    <ul>
        {% for entry in items %}
        <li>
            <span>{{ entry.item.name }} x {{ entry.quantity }}</span>
            <span>${{ entry.subtotal }}</span>
        </li>
        {% endfor %}
    </ul>

    <p class="total">Total: ${{ total }}</p>

    <!-- 🔥 NEW: Payment Method Selection -->
    <h3>Select Payment Method:</h3>

    <select name="payment_method" required>
        <option value="">-- Choose Payment --</option>
        <option value="ESEWA">eSewa</option>
        <option value="KHALTI">Khalti</option>
    </select>

    <div class="button-bar">
        <button type="submit" class="confirm-button">
            Confirm & Pay
        </button>

        <a href="{% url 'view_cart' %}" class="cart-button">
            ← Back to Cart
        </a>

        <a href="{% url 'menu' %}" class="menu-button">
            Continue Ordering →
        </a>
    </div>
</form>

</body>
</html>
