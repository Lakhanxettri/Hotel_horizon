{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Grand Horizon</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-card {
    background: white;
    border-radius: 15px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}
.login-card h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #2c3e50;
    font-weight: 700;
}
.login-card .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
    font-size: 14px;
}
.form-control {
    border-radius: 8px;
    padding: 12px 15px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
}
.form-control:focus {
    border-color: #0f3460;
    box-shadow: 0 0 0 0.2rem rgba(15, 52, 96, 0.15);
}
.btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #0f3460;
    color: white;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.btn-login:hover {
    background: #1a1a2e;
    color: white;
}
.bottom-text {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}
.bottom-text a {
    color: #0f3460;
    font-weight: 600;
    text-decoration: none;
}
.bottom-text a:hover {
    text-decoration: underline;
}
.alert {
    border-radius: 8px;
    font-size: 14px;
    padding: 10px 15px;
}
</style>
</head>
<body>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to Grand Horizon Hotel</p>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
        {% csrf_token %}

        <input type="text" name="username" class="form-control" placeholder="Username" required>
        <input type="password" name="password" class="form-control" placeholder="Password" required>

        <button type="submit" class="btn btn-login">Login</button>
    </form>

    <p class="bottom-text">
        Don't have an account? <a href="{% url 'register' %}">Register here</a>
    </p>
    <p class="bottom-text" style="margin-top: 8px;">
        <a href="{% url 'home' %}">← Back to Home</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
