{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Stay</title>
<style>
body { font-family: Arial; background: #f2f2f2; }
.container { max-width: 500px; margin: 50px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);}
h2 { text-align:center; margin-bottom: 20px; }
label { display:block; margin-top:10px; font-weight:bold; }
input, select { width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc; }
button { margin-top:15px; width:100%; padding:10px; border:none; background:#ff6347; color:white; font-weight:bold; border-radius:5px; cursor:pointer; }
button:hover { background:#e5533d; }
a { display:block; text-align:center; margin-top:15px; text-decoration:none; color:#333; }
</style>
</head>
<body>
<div class="container">
    <h2>Book Your Stay</h2>
    <form method="POST" enctype="multipart/form-data" action="{% url 'booking' %}">
        {% csrf_token %}

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

        <label for="room_type">Room Type</label>
        <select id="room_type" name="room_type" required>
            <option value="">Select a room type</option>
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
        </select>

        <label for="check_in">Check-In Date</label>
        <input type="date" id="check_in" name="check_in" required>

        <label for="check_out">Check-Out Date</label>
        <input type="date" id="check_out" name="check_out" required>

        <label for="nationality">Upload ID / Passport</label>
        <input type="file" id="nationality" name="nationality" accept=".jpg,.jpeg,.png,.pdf" required>

        <button type="submit">Book Now</button>
    </form>

    <a href="{% url 'home' %}">Back to Home</a>
</div>
</body>
</html>
